<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信用取引 損益分析</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f8f7f4; color: #1a1a1a; min-height: 100vh; }
header { padding: 1.5rem 2rem; background: #fff; border-bottom: 0.5px solid #e0ddd8; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.header-text h1 { font-size: 16px; font-weight: 500; }
.header-text p { font-size: 12px; color: #888; margin-top: 2px; }
.header-nav { display: flex; gap: 8px; align-items: center; }
.nav-link { font-size: 12px; color: #888; text-decoration: none; padding: 5px 10px; border: 0.5px solid #e0ddd8; border-radius: 7px; background: #fff; white-space: nowrap; }
.nav-link:hover { color: #1a1a1a; border-color: #aaa; }

.main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

.loading { text-align: center; padding: 4rem 1rem; color: #aaa; font-size: 13px; }
.error-msg { background: #FCEBEB; color: #791F1F; border-radius: 10px; padding: 1rem 1.25rem; font-size: 13px; margin-bottom: 1rem; }

/* ===== フィルターバー ===== */
.filter-bar { background: #fff; border: 0.5px solid #e0ddd8; border-radius: 10px; padding: 0.75rem 1.25rem; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-label { font-size: 11px; color: #888; white-space: nowrap; }
.filter-input { font-size: 12px; border: 0.5px solid #e0ddd8; border-radius: 7px; padding: 5px 10px; outline: none; background: #fff; color: #1a1a1a; }
.filter-input:focus { border-color: #888; }
.filter-sep { font-size: 12px; color: #aaa; }
.btn { font-size: 12px; padding: 5px 14px; border-radius: 7px; cursor: pointer; border: 0.5px solid #e0ddd8; background: #fff; color: #1a1a1a; white-space: nowrap; }
.btn:hover { border-color: #aaa; }
.btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; border-color: #333; }
.filter-note { font-size: 11px; color: #aaa; margin-left: auto; }

/* ===== カード ===== */
.card { background: #fff; border: 0.5px solid #e0ddd8; border-radius: 10px; margin-bottom: 1.25rem; }
.card-header { padding: 0.875rem 1.25rem; border-bottom: 0.5px solid #e0ddd8; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.card-title { font-size: 13px; font-weight: 500; }
.card-sub { font-size: 11px; color: #aaa; }
.card-body { padding: 1rem 1.25rem; }

/* ===== ステータスバー ===== */
.status-bar { background: #fff; border: 0.5px solid #e0ddd8; border-radius: 10px; padding: 0.75rem 1.25rem; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
.status-item { display: flex; flex-direction: column; gap: 1px; }
.status-label { font-size: 10px; color: #aaa; }
.status-value { font-size: 13px; font-weight: 500; }
.status-div { width: 0.5px; height: 28px; background: #e0ddd8; flex-shrink: 0; }

/* ===== サマリーグリッド ===== */
.summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 1.25rem; }
@media (max-width: 760px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 480px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
.metric-card { background: #fff; border: 0.5px solid #e0ddd8; border-radius: 10px; padding: 0.875rem 1rem; }
.metric-label { font-size: 11px; color: #888; margin-bottom: 4px; }
.metric-value { font-size: 22px; font-weight: 500; line-height: 1; }
.metric-unit { font-size: 12px; color: #888; margin-left: 2px; }
.metric-sub { font-size: 11px; color: #aaa; margin-top: 4px; }
.val-pos { color: #27500A; }
.val-neg { color: #791F1F; }
.val-neu { color: #1a1a1a; }

/* ===== チャート ===== */
.chart-wrap { position: relative; height: 220px; }

/* ===== テーブル共通 ===== */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { padding: 8px 12px; font-size: 11px; color: #888; font-weight: 500; text-align: left; background: #f8f7f4; border-bottom: 0.5px solid #e0ddd8; cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: #1a1a1a; }
th.sorted { color: #1a1a1a; }
td { padding: 7px 12px; font-size: 12px; border-bottom: 0.5px solid #f0ede8; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafaf8; }
.td-r { text-align: right; font-variant-numeric: tabular-nums; }
.td-pos { color: #27500A; font-weight: 500; }
.td-neg { color: #791F1F; font-weight: 500; }
.td-muted { color: #aaa; }
.sort-icon { font-size: 10px; margin-left: 3px; }

/* 勝率バー */
.wr-wrap { display: flex; align-items: center; gap: 6px; }
.wr-bar-bg { flex: 1; min-width: 40px; height: 4px; background: #e0ddd8; border-radius: 2px; overflow: hidden; }
.wr-bar-fill { height: 100%; background: #27500A; border-radius: 2px; }
.wr-txt { font-size: 11px; color: #555; flex-shrink: 0; min-width: 34px; text-align: right; }

/* 半月テーブル */
.hm-win { color: #27500A; }
.hm-lose { color: #791F1F; }
.hm-na { color: #ccc; }

/* ページネーション */
.pagination { display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.page-btn { font-size: 11px; padding: 4px 10px; border: 0.5px solid #e0ddd8; border-radius: 6px; background: #fff; cursor: pointer; color: #888; }
.page-btn:hover { border-color: #aaa; color: #1a1a1a; }
.page-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.page-info { font-size: 11px; color: #aaa; text-align: center; margin-top: 8px; }

/* 銘柄展開 */
.stock-row { cursor: pointer; }
.stock-row:hover td { background: #f5f4f1 !important; }
.expand-icon { font-size: 10px; color: #bbb; margin-left: 5px; transition: transform 0.15s; display: inline-block; }
.expand-icon.open { transform: rotate(90deg); }
.detail-row td { padding: 0 !important; background: #fafaf8; }
.detail-inner { overflow: hidden; max-height: 0; transition: max-height 0.2s ease; }
.detail-inner.open { max-height: 2000px; }
.detail-table { width: 100%; border-collapse: collapse; }
.detail-table td { padding: 5px 12px 5px 24px; font-size: 11px; border-bottom: 0.5px solid #f0ede8; color: #555; }
.detail-table tr:last-child td { border-bottom: none; }
.detail-table .dt-pnl { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

/* ファイルアップロード */
.upload-area { border: 1px dashed #e0ddd8; border-radius: 10px; padding: 1.5rem; text-align: center; cursor: pointer; transition: border-color 0.15s; }
.upload-area:hover, .upload-area.drag-over { border-color: #888; }
.upload-area input { display: none; }
.upload-label { font-size: 13px; color: #888; }
.upload-label strong { color: #1a1a1a; }
.upload-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="header-text">
    <h1>信用取引 損益分析</h1>
    <p>SBI証券 約定履歴</p>
  </div>
  <nav class="header-nav">
    <a class="nav-link" href="https://fortissimo147.github.io/Okaka/">2083モニタリング</a>
    <a class="nav-link" href="trading.html">損益分析</a>
    <a class="nav-link" href="kessan_analysis.html">決算分析</a>
    <a class="nav-link" href="expected_growth.html">期待増益率</a>
  </nav>
</header>

<div class="main">
  <!-- 日付フィルター -->
  <div class="filter-bar">
    <span class="filter-label">表示期間</span>
    <input type="date" class="filter-input" id="date-from">
    <span class="filter-sep">〜</span>
    <input type="date" class="filter-input" id="date-to">
    <button class="btn btn-primary" onclick="applyFilter()">適用</button>
    <button class="btn" onclick="clearFilter()">クリア</button>
    <span class="filter-note" id="filter-note"></span>
  </div>

  <div id="app"><div class="loading">データを読み込み中...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script>
const UPLOAD_URL = 'https://raw.githubusercontent.com/fortissimo147/Okaka/main/upload/merged.csv';
const KESSAN_URL = 'https://raw.githubusercontent.com/fortissimo147/Okaka/main/data/kessan.csv';
const PAGE_SIZE = 50;

// ===== 月別パフォーマンス用 入出金・初期残高 =====
const INITIAL_BALANCE = 4000000; // 2025/11 月初
const CASHFLOW = [
  { date: '2025/11/14', amount:  500000 },
  { date: '2025/11/18', amount:  319000 },
  { date: '2026/01/07', amount: -100719 },
  { date: '2026/01/30', amount: -500000 },
  { date: '2026/02/03', amount:   45000 },
  { date: '2026/02/17', amount:   11000 },
  { date: '2026/03/04', amount: -1000000 },
  { date: '2026/03/12', amount:   35000 },
  { date: '2026/03/23', amount:   40000 },
  { date: '2026/04/01', amount:   30000 },
  { date: '2026/04/09', amount:   45000 },
  { date: '2026/04/17', amount:  -10000 },
  { date: '2026/05/04', amount:  -10000 },
];

let allRows = [];        // 全取引行（新規・返済含む）
let completedTrades = []; // 完結トレード
let filteredTrades = [];  // フィルター後
let kessanByCode = {};    // { code: ['2025-10-28', ...] }
let barChart = null;
let stockSort = { col: 'pnl', dir: -1 };
let tradeSort = { col: 'endDate', dir: -1 };
let tradePage = 1;

// ===== データ取得 =====
async function load() {
  try {
    const [sbiRes, kessanRes] = await Promise.allSettled([
      fetch(UPLOAD_URL),
      fetch(KESSAN_URL),
    ]);
    if (sbiRes.status === 'rejected' || !sbiRes.value.ok) throw new Error(`HTTP ${sbiRes.value?.status ?? 'network error'}`);
    const buf = await sbiRes.value.arrayBuffer();
    const text = new TextDecoder('shift-jis').decode(buf);
    if (kessanRes.status === 'fulfilled' && kessanRes.value.ok) {
      kessanByCode = parseKessan(await kessanRes.value.text());
    }
    init(text);
  } catch(e) {
    showUpload(`データ取得エラー: ${e.message}`);
  }
}

function parseKessan(text) {
  // 横持ち形式: code, name, date_01, date_02, ...
  const map = {};
  const lines = text.split('\n');
  if (lines.length < 2) return map;
  const hdrs = parseCSVLine(lines[0]).map(h => h.replace(/^﻿/, ''));
  const codeIdx = hdrs.indexOf('code');
  if (codeIdx < 0) return map;
  const dateIdxs = hdrs.map((h, i) => h.startsWith('date_') ? i : -1).filter(i => i >= 0);
  if (dateIdxs.length === 0) return map;
  for (let i = 1; i < lines.length; i++) {
    const c = parseCSVLine(lines[i].trim());
    if (c.length < 2) continue;
    const code = (c[codeIdx] || '').trim();
    if (!code) continue;
    const dates = dateIdxs.map(idx => (c[idx] || '').trim()).filter(Boolean);
    if (dates.length) map[code] = dates;
  }
  return map;
}

function init(text) {
  allRows = parseSBI(text);
  completedTrades = calcCompletedTrades(allRows);
  // 決算跨ぎフラグ付与
  completedTrades.forEach(t => {
    const dates = kessanByCode[t.code] || [];
    const start = slashToHyphen(t.startDate);
    const end   = slashToHyphen(t.endDate);
    t.isKessanMatagi = dates.some(d => d >= start && d <= end);
  });
  filteredTrades = completedTrades.slice();

  // デフォルト日付セット
  if (completedTrades.length > 0) {
    const dates = completedTrades.map(t => t.endDate).sort();
    document.getElementById('date-from').value = slashToHyphen(dates[0]);
    document.getElementById('date-to').value = slashToHyphen(dates[dates.length - 1]);
  }

  render();
}

function applyFilter() {
  const from = document.getElementById('date-from').value;
  const to = document.getElementById('date-to').value;
  filteredTrades = completedTrades.filter(t => {
    const d = slashToHyphen(t.endDate);
    return (!from || d >= from) && (!to || d <= to);
  });
  tradePage = 1;
  updateFilterNote(from, to);
  render();
}

function clearFilter() {
  if (completedTrades.length > 0) {
    const dates = completedTrades.map(t => t.endDate).sort();
    document.getElementById('date-from').value = slashToHyphen(dates[0]);
    document.getElementById('date-to').value = slashToHyphen(dates[dates.length - 1]);
  }
  filteredTrades = completedTrades.slice();
  tradePage = 1;
  document.getElementById('filter-note').textContent = '';
  render();
}

function updateFilterNote(from, to) {
  const note = document.getElementById('filter-note');
  note.textContent = (from || to) ? `${filteredTrades.length} 件表示中` : '';
}

// ===== CSV パース（全行） =====
function parseCSVLine(line) {
  const r = []; let inQ = false, cur = '';
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') inQ = !inQ;
    else if (c === ',' && !inQ) { r.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  r.push(cur.trim());
  return r;
}

function parseSBI(text) {
  const lines = text.split('\n');
  let hi = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith('約定日')) { hi = i; break; }
  }
  if (hi === -1) { showUpload('SBIフォーマットが認識できません'); return []; }

  const hdrs = parseCSVLine(lines[hi]);
  const IDX = {
    date:  hdrs.indexOf('約定日'),
    name:  hdrs.indexOf('銘柄'),
    code:  hdrs.indexOf('銘柄コード'),
    type:  hdrs.indexOf('取引'),
    qty:   hdrs.indexOf('約定数量'),
    price: hdrs.indexOf('約定単価'),
    pnl:   hdrs.indexOf('受渡金額/決済損益'),
  };

  const rows = [];
  for (let i = hi + 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const c = parseCSVLine(line);
    if (c.length < 5) continue;
    const type = c[IDX.type] || '';
    if (!type.includes('信用')) continue;

    const pnlStr = c[IDX.pnl];
    const pnl = (pnlStr && pnlStr !== '--') ? parseFloat(pnlStr) : null;
    const date = c[IDX.date] || '';

    rows.push({
      date,
      ym: date.slice(0, 7),
      name: c[IDX.name] || '',
      code: c[IDX.code] || '',
      type,
      qty: parseFloat(c[IDX.qty]) || 0,
      price: parseFloat(c[IDX.price]) || 0,
      pnl,
    });
  }
  return rows;
}

// ===== 完結トレード計算（銘柄ごとに株数0→0でひと勝負） =====
function calcCompletedTrades(rows) {
  // 日付昇順、同日内は新規建を返済より先に処理（CSV行順が逆になる場合の対策）
  const sorted = rows.slice().sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    const aNew = a.type.includes('新規') ? 0 : 1;
    const bNew = b.type.includes('新規') ? 0 : 1;
    return aNew - bNew;
  });

  const state = {}; // code → { net, accPnl, startDate, name, inTrade, totalCost }
  const trades = [];

  sorted.forEach(row => {
    const k = row.code;
    if (!state[k]) state[k] = { net: 0, accPnl: 0, startDate: null, name: '', inTrade: false, totalCost: 0 };
    const s = state[k];

    // 新規建てでトレード開始
    if (!s.inTrade && row.type.includes('新規')) {
      s.startDate = row.date;
      s.name = row.name;
      s.accPnl = 0;
      s.totalCost = 0;
      s.inTrade = true;
    }

    // 株数を更新
    if      (row.type.includes('新規買')) { s.net += row.qty; s.totalCost += row.qty * row.price; }
    else if (row.type.includes('新規売')) { s.net -= row.qty; s.totalCost += row.qty * row.price; }
    else if (row.type.includes('返済売')) { s.net -= row.qty; if (row.pnl !== null) s.accPnl += row.pnl; }
    else if (row.type.includes('返済買')) { s.net += row.qty; if (row.pnl !== null) s.accPnl += row.pnl; }

    // 株数が0に戻ったら一勝負確定
    if (s.inTrade && Math.abs(s.net) < 0.01) {
      const pnlRounded = Math.round(s.accPnl);
      const costBasis = Math.round(s.totalCost);
      trades.push({
        code: k,
        name: s.name,
        startDate: s.startDate,
        endDate: row.date,
        endYm: row.ym,
        pnl: pnlRounded,
        win: s.accPnl > 0,
        costBasis,
        pct: costBasis > 0 ? s.accPnl / s.totalCost * 100 : null,
      });
      s.net = 0;
      s.accPnl = 0;
      s.totalCost = 0;
      s.startDate = null;
      s.inTrade = false;
    }
  });

  return trades.sort((a, b) => a.endDate.localeCompare(b.endDate));
}

// ===== 半月ごとの直近40勝負勝率 =====
function buildHalfMonthTable(allTrades) {
  if (allTrades.length === 0) return [];

  const sorted = allTrades.slice().sort((a, b) => a.endDate.localeCompare(b.endDate));
  const firstDate = sorted[0].endDate;
  const lastDate = sorted[sorted.length - 1].endDate;

  const parseD = d => { const [y,m,day] = d.split('/').map(Number); return new Date(y, m-1, day); };
  const fmtD = d => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;

  const start = parseD(firstDate);
  const end = parseD(lastDate);
  const rows = [];

  let cur = new Date(start.getFullYear(), start.getMonth(), 1);
  while (cur <= end) {
    const y = cur.getFullYear(), m = cur.getMonth();

    // 前半（〜15日）
    const fhEnd = new Date(y, m, 15);
    const fhStr = fmtD(fhEnd);
    const fhStart = fmtD(new Date(y, m, 1));
    if (fhEnd >= start && fhEnd <= end) {
      const up = sorted.filter(t => t.endDate <= fhStr);
      const last40 = up.slice(-40);
      const wins = last40.filter(t => t.win).length;
      const periodTrades = sorted.filter(t => t.endDate >= fhStart && t.endDate <= fhStr);
      rows.push({
        label: `${y}/${String(m+1).padStart(2,'0')} 前半`,
        endDate: fhStr,
        wins, total: last40.length,
        rate: last40.length > 0 ? wins / last40.length * 100 : null,
        cumCount: up.length,
        trades: periodTrades,
        totalCost: periodTrades.reduce((s, t) => s + (t.costBasis || 0), 0),
      });
    }

    // 後半（〜月末）
    const lhEnd = new Date(y, m+1, 0);
    const lhStr = fmtD(lhEnd);
    const lhStart = fmtD(new Date(y, m, 16));
    if (lhEnd >= start && lhEnd <= end) {
      const up = sorted.filter(t => t.endDate <= lhStr);
      const last40 = up.slice(-40);
      const wins = last40.filter(t => t.win).length;
      const periodTrades = sorted.filter(t => t.endDate >= lhStart && t.endDate <= lhStr);
      rows.push({
        label: `${y}/${String(m+1).padStart(2,'0')} 後半`,
        endDate: lhStr,
        wins, total: last40.length,
        rate: last40.length > 0 ? wins / last40.length * 100 : null,
        cumCount: up.length,
        trades: periodTrades,
        totalCost: periodTrades.reduce((s, t) => s + (t.costBasis || 0), 0),
      });
    }

    cur = new Date(y, m+1, 1);
  }

  return rows;
}

// ===== 描画 =====
function render() {
  if (barChart) { barChart.destroy(); barChart = null; }
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (filteredTrades.length === 0) {
    const m = document.createElement('div');
    m.className = 'loading';
    m.textContent = '完結したトレードがありません（期間を変更してください）';
    app.appendChild(m);
    return;
  }

  const stats = calcStats(filteredTrades);

  // ステータスバー
  app.appendChild(buildStatusBar());

  // サマリーグリッド
  app.appendChild(buildSummaryGrid(stats));

  // 月別損益チャート
  app.appendChild(buildMonthlyCard(filteredTrades));

  // 月別パフォーマンス（残高・収益率）
  app.appendChild(buildMonthlyPerformanceCard(completedTrades));

  // 直近20勝負 勝率推移（全データ使用）
  app.appendChild(buildHalfMonthCard(completedTrades));

  // 決算跨ぎ分析
  app.appendChild(buildKessanMatagiCard(filteredTrades));

  // 銘柄別損益
  app.appendChild(buildStockTable(stats.byStock, filteredTrades));

  // 完結トレード一覧
  app.appendChild(buildTradeTable(filteredTrades));
}

function calcStats(trades) {
  const wins = trades.filter(t => t.win);
  const losses = trades.filter(t => !t.win);
  const totalPnl = trades.reduce((s, t) => s + t.pnl, 0);
  const totalWin = wins.reduce((s, t) => s + t.pnl, 0);
  const totalLoss = losses.reduce((s, t) => s + t.pnl, 0);
  const pf = totalLoss !== 0 ? totalWin / Math.abs(totalLoss) : Infinity;

  const monthMap = {};
  trades.forEach(t => {
    if (!monthMap[t.endYm]) monthMap[t.endYm] = { pnl: 0, wins: 0, losses: 0 };
    monthMap[t.endYm].pnl += t.pnl;
    if (t.win) monthMap[t.endYm].wins++; else monthMap[t.endYm].losses++;
  });

  const stockMap = {};
  trades.forEach(t => {
    const k = t.code;
    if (!stockMap[k]) stockMap[k] = { name: t.name, code: t.code, pnl: 0, wins: 0, losses: 0, count: 0 };
    stockMap[k].pnl += t.pnl;
    stockMap[k].count++;
    if (t.win) stockMap[k].wins++; else stockMap[k].losses++;
  });

  const winsWithCost  = wins.filter(t => t.costBasis > 0);
  const lossesWithCost = losses.filter(t => t.costBasis > 0);
  const avgWinPct  = winsWithCost.length  > 0 ? winsWithCost.reduce((s, t)  => s + t.pnl / t.costBasis * 100, 0) / winsWithCost.length  : null;
  const avgLossPct = lossesWithCost.length > 0 ? lossesWithCost.reduce((s, t) => s + t.pnl / t.costBasis * 100, 0) / lossesWithCost.length : null;

  return {
    total: trades.length,
    winCount: wins.length, lossCount: losses.length,
    winRate: trades.length > 0 ? wins.length / trades.length * 100 : 0,
    totalPnl, totalWin, totalLoss, pf,
    avgWin: wins.length > 0 ? totalWin / wins.length : 0,
    avgLoss: losses.length > 0 ? totalLoss / losses.length : 0,
    avgWinPct, avgLossPct,
    bestPnl: trades.reduce((m, t) => t.pnl > m ? t.pnl : m, -Infinity),
    worstPnl: trades.reduce((m, t) => t.pnl < m ? t.pnl : m, Infinity),
    bestPct:  trades.filter(t => t.pct != null).length > 0 ? Math.max(...trades.filter(t => t.pct != null).map(t => t.pct)) : null,
    worstPct: trades.filter(t => t.pct != null).length > 0 ? Math.min(...trades.filter(t => t.pct != null).map(t => t.pct)) : null,
    monthly: Object.entries(monthMap).sort((a, b) => a[0].localeCompare(b[0])),
    byStock: Object.values(stockMap),
  };
}

function calcOpenPositions() {
  const state = {};
  allRows.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(row => {
    const k = row.code;
    if (!state[k]) state[k] = 0;
    if      (row.type.includes('新規買')) state[k] += row.qty;
    else if (row.type.includes('新規売')) state[k] -= row.qty;
    else if (row.type.includes('返済売')) state[k] -= row.qty;
    else if (row.type.includes('返済買')) state[k] += row.qty;
  });
  return Object.values(state).filter(n => Math.abs(n) >= 0.01).length;
}

function buildMonthlyPerformanceCard(allTrades) {
  // 月ごとのトレード損益を集計（完結トレードの決済月ベース）
  const tradePnlByYm = {};
  allTrades.forEach(t => {
    if (!tradePnlByYm[t.endYm]) tradePnlByYm[t.endYm] = 0;
    tradePnlByYm[t.endYm] += t.pnl;
  });

  // 月ごとの入出金を集計
  const cashByYm = {};
  CASHFLOW.forEach(cf => {
    const ym = cf.date.slice(0, 7); // "2025/11"
    if (!cashByYm[ym]) cashByYm[ym] = 0;
    cashByYm[ym] += cf.amount;
  });

  // 月リスト（2025/11 〜 最新月）
  const allYms = new Set([
    ...Object.keys(tradePnlByYm),
    ...Object.keys(cashByYm),
  ]);
  const START_YM = '2025/11';
  const months = Array.from(allYms).filter(ym => ym >= START_YM).sort();

  // 月初残高・月末残高・収益率を計算
  let balance = INITIAL_BALANCE;
  const rows = [];
  for (const ym of months) {
    const startBal = balance;
    const tradePnl = Math.round(tradePnlByYm[ym] || 0);
    const netCash  = cashByYm[ym] || 0;
    const endBal   = startBal + tradePnl + netCash;
    const retPct   = startBal > 0 ? tradePnl / startBal * 100 : null;
    rows.push({ ym, startBal, tradePnl, netCash, endBal, retPct });
    balance = endBal;
  }

  const fmt = n => n >= 0
    ? '+' + n.toLocaleString() + ' 円'
    : n.toLocaleString() + ' 円';
  const fmtBal = n => n.toLocaleString() + ' 円';
  const fmtPct = p => p === null ? '-' : (p >= 0 ? '+' : '') + p.toFixed(2) + '%';
  const cls = v => v > 0 ? 'td-pos' : v < 0 ? 'td-neg' : '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      <div class="card-title">月別パフォーマンス</div>
      <div class="card-sub">トレード損益 / 月初残高（入出金除く）</div>
    </div>
    <div class="card-body">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>月</th>
              <th class="td-r">月初残高</th>
              <th class="td-r">トレード損益</th>
              <th class="td-r">入出金</th>
              <th class="td-r">月末残高</th>
              <th class="td-r">収益率</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.ym}</td>
                <td class="td-r">${fmtBal(r.startBal)}</td>
                <td class="td-r ${cls(r.tradePnl)}">${fmt(r.tradePnl)}</td>
                <td class="td-r ${cls(r.netCash)}">${r.netCash !== 0 ? fmt(r.netCash) : '-'}</td>
                <td class="td-r">${fmtBal(r.endBal)}</td>
                <td class="td-r ${cls(r.retPct)}">${fmtPct(r.retPct)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  return card;
}

  card.appendChild(hdr);

  const NCOLS = 5;

  function costToClassIdx(cost) {
    return Math.max(2, Math.round(cost / 500000));
  }
  function classIdxToName(idx) {
    return `${idx * 50}万円クラス`;
  }
  function medianClassIdx(trades) {
    const idxs = trades.filter(t => t.costBasis > 0).map(t => costToClassIdx(t.costBasis));
    if (idxs.length === 0) return null;
    idxs.sort((a, b) => a - b);
    const mid = Math.floor(idxs.length / 2);
    return idxs.length % 2 === 0 ? (idxs[mid - 1] + idxs[mid]) / 2 : idxs[mid];
  }

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const table = document.createElement('table');

    let rateCls = 'hm-na', rateStr = '-';

      rateStr = row.rate.toFixed(1) + '%';
      rateCls = row.rate >= 50 ? 'hm-win' : 'hm-lose';
    }
    const hasTrades = row.trades.length > 0;
    const icon = hasTrades ? `<span class="expand-icon" id="hm-ei-${idx}">▶</span>` : '';

      <td class="td-r">
        <div class="wr-wrap" style="justify-content:flex-end">
          <div class="wr-bar-bg" style="max-width:80px"><div class="wr-bar-fill" style="width:${row.rate ?? 0}%"></div></div>
          <span class="wr-txt ${rateCls}">${rateStr}</span>
        </div>
      </td>
      <td class="td-r td-pos">${row.total > 0 ? row.wins : '-'}</td>
      <td class="td-r td-neg">${row.total > 0 ? row.total - row.wins : '-'}</td>
      <td class="td-r td-muted">${row.cumCount}</td>
    `;

    // 詳細行
    const detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    const detailTd = document.createElement('td');
    detailTd.colSpan = NCOLS;
    const inner = document.createElement('div');
    inner.className = 'detail-inner';
    inner.id = `hm-detail-${idx}`;

    const periodMedian = medianClassIdx(row.trades);
    const dtTable = document.createElement('table');
    dtTable.className = 'detail-table';
    row.trades.slice().sort((a, b) => a.endDate.localeCompare(b.endDate)).forEach((t, i) => {
      const dtr = document.createElement('tr');
      const dpnlCls = t.pnl > 0 ? 'td-pos' : t.pnl < 0 ? 'td-neg' : '';
      const winCol = t.win ? '#27500A' : '#791F1F';
      const pctStr = t.pct != null ? `${t.pct >= 0 ? '+' : ''}${t.pct.toFixed(2)}%` : '';
      let classLabel = '-';
      let outlier = false;
      if (t.costBasis > 0) {
        const ci = costToClassIdx(t.costBasis);
        classLabel = classIdxToName(ci);
        if (periodMedian !== null && ci - periodMedian >= 2) outlier = true;
      }
      if (outlier) dtr.style.color = '#e05555';
      dtr.innerHTML = `
        <td style="color:${outlier ? '#e05555' : '#bbb'};width:24px;text-align:right">${i + 1}</td>

        <td style="color:${winCol};font-weight:500">${t.win ? '勝' : '負'}</td>
        <td style="color:${winCol};font-size:10px;text-align:right;padding-left:2px">${pctStr}</td>
        <td style="color:${outlier ? '#e05555' : '#aaa'};font-size:11px;text-align:right">${classLabel}</td>
      `;
      dtTable.appendChild(dtr);
    });
    inner.appendChild(dtTable);
    detailTd.appendChild(inner);
    detailTr.appendChild(detailTd);

    if (hasTrades) {
      tr.addEventListener('click', () => {
        const innerEl = document.getElementById(`hm-detail-${idx}`);

  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  hdr.innerHTML = `<div class="card-title">銘柄別損益</div><div class="card-sub">${byStock.length} 銘柄（行クリックで勝負履歴）</div>`;
  card.appendChild(hdr);

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';

  const cols = [
    { key: 'code', label: 'コード' },
    { key: 'name', label: '銘柄名' },
    { key: 'count', label: '勝負数' },
    { key: 'wins', label: '勝' },
    { key: 'losses', label: '負' },
    { key: 'winRate', label: '勝率', derived: r => r.count > 0 ? r.wins / r.count * 100 : 0 },
    { key: 'pnl', label: '合計損益' },
  ];

  // 銘柄ごとのトレード履歴（降順）
  const tradesByCode = {};
  allTrades.forEach(t => {
    if (!tradesByCode[t.code]) tradesByCode[t.code] = [];
    tradesByCode[t.code].push(t);
  });
  Object.values(tradesByCode).forEach(arr => arr.sort((a, b) => b.endDate.localeCompare(a.endDate)));

  function mkTbody(data) {
    const sorted = data.slice().sort((a, b) => {
      const col = cols.find(c => c.key === stockSort.col);
      const av = col?.derived ? col.derived(a) : (a[stockSort.col] ?? 0);
      const bv = col?.derived ? col.derived(b) : (b[stockSort.col] ?? 0);
      return stockSort.dir * (typeof av === 'string' ? av.localeCompare(bv) : bv - av);
    });
    const tbody = document.createElement('tbody');
    sorted.forEach(s => {
      const wr = s.count > 0 ? s.wins / s.count * 100 : 0;
      const NCOLS = cols.length;

      // メイン行
      const tr = document.createElement('tr');
      tr.className = 'stock-row';
      const icon = `<span class="expand-icon" id="ei-${s.code}">▶</span>`;
      tr.innerHTML = `
        <td class="td-r td-muted" style="font-size:11px">${s.code}</td>
        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${s.name}">${s.name}${icon}</td>
        <td class="td-r">${s.count}</td>
        <td class="td-r td-pos">${s.wins}</td>
        <td class="td-r td-neg">${s.losses}</td>
        <td><div class="wr-wrap"><div class="wr-bar-bg"><div class="wr-bar-fill" style="width:${wr.toFixed(1)}%"></div></div><span class="wr-txt">${wr.toFixed(0)}%</span></div></td>
        <td class="td-r ${s.pnl >= 0 ? 'td-pos' : 'td-neg'}">${fmtPnlFull(s.pnl)}</td>
      `;

      // 詳細行（折りたたみ）
      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      const detailTd = document.createElement('td');
      detailTd.colSpan = NCOLS;
      const inner = document.createElement('div');
      inner.className = 'detail-inner';
      inner.id = `detail-${s.code}`;

      const trades = tradesByCode[s.code] || [];
      const dtTable = document.createElement('table');
      dtTable.className = 'detail-table';
      trades.forEach((t, i) => {
        const dtr = document.createElement('tr');
        const pnlCls = t.pnl > 0 ? 'td-pos' : t.pnl < 0 ? 'td-neg' : '';
        const winCol = t.win ? '#27500A' : '#791F1F';
        const pctStr = t.pct != null ? `${t.pct >= 0 ? '+' : ''}${t.pct.toFixed(2)}%` : '';
        const kmLabel = t.isKessanMatagi ? `<span style="font-size:9px;color:#888;font-weight:normal;margin-left:4px">＊決算跨ぎ</span>` : '';
        dtr.innerHTML = `
          <td style="color:#bbb;width:24px;text-align:right">${trades.length - i}</td>
          <td>${t.endDate}</td>
          <td style="color:#aaa">${t.startDate} 〜</td>
          <td class="dt-pnl ${pnlCls}">${fmtPnlFull(t.pnl)}</td>
          <td style="color:${winCol};font-weight:500">${t.win ? '勝' : '負'}${kmLabel}</td>
          <td style="color:${winCol};font-size:10px;text-align:right;padding-left:2px">${pctStr}</td>
        `;
        dtTable.appendChild(dtr);
      });
      inner.appendChild(dtTable);
      detailTd.appendChild(inner);
      detailTr.appendChild(detailTd);

      // クリックで開閉
      tr.addEventListener('click', () => {
        const innerEl = document.getElementById(`detail-${s.code}`);
        const iconEl = document.getElementById(`ei-${s.code}`);
        const isOpen = innerEl.classList.contains('open');
        innerEl.classList.toggle('open', !isOpen);
        iconEl.classList.toggle('open', !isOpen);
      });

      tbody.appendChild(tr);
      tbody.appendChild(detailTr);
    });
    return tbody;
  }

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  cols.forEach(col => {
    const th = document.createElement('th');
    th.innerHTML = col.label + (stockSort.col === col.key ? `<span class="sort-icon">${stockSort.dir === -1 ? '↓' : '↑'}</span>` : '');
    if (stockSort.col === col.key) th.classList.add('sorted');
    th.addEventListener('click', () => {
      if (stockSort.col === col.key) stockSort.dir *= -1;
      else { stockSort.col = col.key; stockSort.dir = -1; }
      table.replaceChild(mkTbody(byStock), table.querySelector('tbody'));
      thead.querySelectorAll('th').forEach((t, i) => {
        t.innerHTML = cols[i].label + (stockSort.col === cols[i].key ? `<span class="sort-icon">${stockSort.dir === -1 ? '↓' : '↑'}</span>` : '');
        t.classList.toggle('sorted', stockSort.col === cols[i].key);
      });
    });
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);
  table.appendChild(mkTbody(byStock));
  wrap.appendChild(table);
  card.appendChild(wrap);
  return card;
}

function buildTradeTable(trades) {
  const card = document.createElement('div');
  card.className = 'card';
  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  hdr.innerHTML = `<div class="card-title">完結トレード一覧</div><div class="card-sub">${trades.length} 件</div>`;
  card.appendChild(hdr);

  const bodyEl = document.createElement('div');
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';

  const cols = [
    { key: 'endDate', label: '決済日' },
    { key: 'startDate', label: '建日' },
    { key: 'name', label: '銘柄' },
    { key: 'code', label: 'コード' },
    { key: 'pnl', label: '損益' },
  ];

  function buildContent() {
    bodyEl.innerHTML = '';
    const sorted = trades.slice().sort((a, b) => {
      const av = a[tradeSort.col] ?? '', bv = b[tradeSort.col] ?? '';
      return tradeSort.dir * (typeof av === 'string' ? bv.localeCompare(av) : bv - av);
    });
    const totalPages = Math.ceil(sorted.length / PAGE_SIZE);
    const page = sorted.slice((tradePage - 1) * PAGE_SIZE, tradePage * PAGE_SIZE);

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    cols.forEach(col => {
      const th = document.createElement('th');
      th.innerHTML = col.label + (tradeSort.col === col.key ? `<span class="sort-icon">${tradeSort.dir === -1 ? '↓' : '↑'}</span>` : '');
      if (tradeSort.col === col.key) th.classList.add('sorted');
      th.addEventListener('click', () => {
        if (tradeSort.col === col.key) tradeSort.dir *= -1;
        else { tradeSort.col = col.key; tradeSort.dir = -1; }
        tradePage = 1; buildContent();
      });
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    page.forEach(t => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${t.endDate}</td>
        <td class="td-muted">${t.startDate}</td>
        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${t.name}">${t.name}</td>
        <td class="td-muted" style="font-size:11px">${t.code}</td>
        <td class="td-r ${t.pnl > 0 ? 'td-pos' : t.pnl < 0 ? 'td-neg' : ''}">${fmtPnlFull(t.pnl)}</td>
      `;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.innerHTML = '';
    wrap.appendChild(table);
    bodyEl.appendChild(wrap);

    if (totalPages > 1) {
      const pag = document.createElement('div');
      pag.className = 'pagination';
      for (let p = 1; p <= totalPages; p++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (p === tradePage ? ' active' : '');
        btn.textContent = p;
        btn.addEventListener('click', () => { tradePage = p; buildContent(); });
        pag.appendChild(btn);
      }
      bodyEl.appendChild(pag);
      const info = document.createElement('div');
      info.className = 'page-info';
      info.textContent = `${(tradePage-1)*PAGE_SIZE+1}〜${Math.min(tradePage*PAGE_SIZE, sorted.length)} 件 / 全${sorted.length}件`;
      bodyEl.appendChild(info);
    }
  }

  buildContent();
  card.appendChild(bodyEl);
  return card;
}

// ===== ファイルアップロード =====
function showUpload(errMsg) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (errMsg) {
    const e = document.createElement('div');
    e.className = 'error-msg';
    e.textContent = errMsg;
    app.appendChild(e);
  }
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header"><div class="card-title">CSVファイルを読み込む</div></div>
    <div class="card-body">
      <div class="upload-area" id="drop-area">
        <input type="file" id="file-input" accept=".csv">
        <label for="file-input" class="upload-label"><strong>クリック</strong>してCSVを選択、またはドラッグ＆ドロップ</label>
        <div class="upload-hint">SBI証券の約定履歴CSVに対応（Shift-JIS）</div>
      </div>
    </div>`;
  app.appendChild(card);
  document.getElementById('file-input').addEventListener('change', e => readFile(e.target.files[0]));
  const drop = document.getElementById('drop-area');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag-over'); readFile(e.dataTransfer.files[0]); });
}

function readFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => init(new TextDecoder('shift-jis').decode(e.target.result));
  reader.readAsArrayBuffer(file);
}

// ===== ユーティリティ =====
function slashToHyphen(d) { return d ? d.replace(/\//g, '-') : ''; }

function fmtPnlShort(n) {
  if (n == null || isNaN(n)) return '-';
  const abs = Math.abs(n);
  const sign = n >= 0 ? '+' : '-';
  if (abs >= 1e6) return sign + (abs / 1e4).toFixed(0) + '万';
  if (abs >= 1e4) return sign + (abs / 1e4).toFixed(1) + '万';
  return (n >= 0 ? '+' : '') + n.toLocaleString('ja-JP');
}

function fmtPnlFull(n) {
  if (n == null || isNaN(n)) return '-';
  return (n >= 0 ? '+' : '') + n.toLocaleString('ja-JP');
}

function fmtK(n) {
  if (Math.abs(n) >= 1e6) return (n / 1e4).toFixed(0) + '万';
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(0) + 'k';
  return n;
}
