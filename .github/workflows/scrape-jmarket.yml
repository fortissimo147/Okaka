name: 決算短信日取得（j-market.info）

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "開始日 YYYY-MM-DD（省略時: CSVの最新日+1日）"
        required: false
        default: ""
      to_date:
        description: "終了日 YYYY-MM-DD（省略時: 今日）"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリインストール
        run: pip install requests beautifulsoup4

      - name: 決算短信日取得
        run: |
          FROM="${{ github.event.inputs.from_date }}"
          TO="${{ github.event.inputs.to_date }}"
          ARGS=""
          [ -n "$FROM" ] && ARGS="$ARGS --from $FROM"
          [ -n "$TO"   ] && ARGS="$ARGS --to $TO"
          python scripts/scrape_jmarket.py $ARGS --out data/kessan.csv

      - name: 取得件数確認
        run: |
          echo "=== kessan.csv 末尾 ==="
          tail -5 data/kessan.csv

      - name: コミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kessan.csv
          git commit -m "update kessan via j-market.info" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
