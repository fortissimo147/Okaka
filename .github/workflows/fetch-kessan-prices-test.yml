name: 決算日±1株価取得（テスト・3社）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: 株価データ取得（3社のみ）
        run: |
          uv run python -c "
          from scripts.fetch_kessan_prices import load_kessan, needed_dates, fetch_prices_for_code, assign_offsets
          import csv as csv_mod, time, requests
          from datetime import datetime, timedelta
          from pathlib import Path

          OUTPUT = Path('data/kessan_prices_test.csv')

          kessan = load_kessan()
          codes = sorted(kessan.keys())[:3]
          print(f'対象コード: {codes}')

          session = requests.Session()
          all_records = []

          for i, code in enumerate(codes, 1):
              dates = kessan[code]
              target = needed_dates(dates)
              earliest = min(
                  (datetime.strptime(d, '%Y-%m-%d') - timedelta(days=5)).strftime('%Y-%m-%d')
                  for d in dates
              )
              print(f'[{i}/3] {code}  決算日: {dates}')
              price_by_date = fetch_prices_for_code(session, code, target, earliest)
              print(f'  取得日付数: {len(price_by_date)}件')
              rows = assign_offsets(price_by_date, dates)
              for r in rows:
                  r['code'] = code
              all_records.extend(rows)
              print(f'  オフセット付与後: {len(rows)}件')
              time.sleep(0.8)

          fieldnames = ['code','kessan_date','offset','date','open','high','low','close','change_pct']
          with open(OUTPUT, 'w', newline='', encoding='utf-8-sig') as f:
              writer = csv_mod.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(all_records)
          print(f'完了: {len(all_records)}件 -> {OUTPUT}')
          "

      - name: 結果確認
        run: |
          echo "=== 取得件数 ==="
          wc -l data/kessan_prices_test.csv
          echo "=== 全行 ==="
          cat data/kessan_prices_test.csv

      - name: コミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kessan_prices_test.csv
          git diff --staged --quiet && echo "変更なし、スキップ" && exit 0
          git commit -m "テスト: 決算日±1株価（3社）$(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
