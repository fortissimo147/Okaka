name: 決算日±1株価取得（テスト・上位10銘柄）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: 株価データ取得（上位10銘柄のみ）
        run: |
          uv run python -c "
          import sys
          sys.argv = ['fetch_kessan_prices']
          from scripts.fetch_kessan_prices import load_kessan, needed_dates, fetch_prices_for_code, assign_offsets
          import csv, time, requests
          from datetime import datetime, timedelta
          from pathlib import Path

          INTERVAL_SEC = 0.8
          OUTPUT = Path('data/kessan_prices_test.csv')

          kessan = load_kessan()
          codes = sorted(kessan.keys())[:10]
          print(f'対象: {codes}')

          session = requests.Session()
          all_records = []

          for i, code in enumerate(codes, 1):
              dates = kessan[code]
              target = needed_dates(dates)
              earliest = min(
                  (datetime.strptime(d, '%Y-%m-%d') - timedelta(days=5)).strftime('%Y-%m-%d')
                  for d in dates
              )
              print(f'[{i}/10] {code} ({len(dates)}決算)', end=' ', flush=True)
              price_by_date = fetch_prices_for_code(session, code, target, earliest)
              rows = assign_offsets(price_by_date, dates)
              for r in rows:
                  r['code'] = code
              all_records.extend(rows)
              print(f'-> {len(rows)} 件')
              time.sleep(INTERVAL_SEC)

          fieldnames = ['code','kessan_date','offset','date','open','high','low','close','change_pct']
          with open(OUTPUT, 'w', newline='', encoding='utf-8-sig') as f:
              import csv as csv_mod
              writer = csv_mod.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(all_records)
          print(f'完了: {len(all_records)} 件 -> {OUTPUT}')
          "

      - name: 取得結果確認
        run: |
          echo "=== 取得件数 ==="
          wc -l data/kessan_prices_test.csv
          echo "=== 全行 ==="
          cat data/kessan_prices_test.csv

      - name: コミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kessan_prices_test.csv
          git diff --staged --quiet || git commit -m "テスト: 決算日±1株価（上位10銘柄）$(date +'%Y-%m-%d')"
          git push
