name: 決算日データ取得（かぶたん）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリインストール
        run: pip install requests beautifulsoup4

      - name: 決算日データ取得
        run: |
          python scripts/scrape_kessan_kabutan.py \
            --codes data/company_names.json \
            --out   data/kessan.csv

      - name: CSV プレビュー
        run: |
          echo "=== 取得件数 ==="
          wc -l data/kessan.csv
          echo "=== 先頭10行 ==="
          head -11 data/kessan.csv

      - name: コミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kessan.csv
          git diff --staged --quiet || git commit -m "決算日データ更新: $(date +'%Y-%m-%d')"
          git push
