name: 決算日±1株価取得（かぶたん）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最大6時間

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: 株価データ取得
        run: uv run python -m scripts.fetch_kessan_prices

      - name: 取得件数確認
        run: |
          echo "=== 取得件数 ==="
          wc -l data/kessan_prices.csv
          echo "=== 先頭5行 ==="
          head -6 data/kessan_prices.csv

      - name: コミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kessan_prices.csv
          git diff --staged --quiet && echo "変更なし、スキップ" && exit 0
          git commit -m "決算日±1株価データ更新: $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
