name: かぶたん HTML構造デバッグ

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: HTMLダンプ・テーブル構造確認
        run: |
          uv run python -c "
          import requests
          from bs4 import BeautifulSoup

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'ja,en-US;q=0.9',
              'Referer': 'https://kabutan.jp/',
          }

          for page in [1, 2, 10]:
              url = f'https://kabutan.jp/stock/kabuka?code=6965&ashi=day&page={page}'
              resp = requests.get(url, headers=HEADERS, timeout=20)
              print(f'=== page={page} HTTP {resp.status_code} ===')
              soup = BeautifulSoup(resp.text, 'html.parser')

              # stock_kabuka_dwm を直接探す
              t = soup.find('table', class_='stock_kabuka_dwm')
              if t is None:
                  print('  stock_kabuka_dwm: 見つからない')
                  # 全テーブル列挙
                  for tbl in soup.find_all('table'):
                      print('  table class:', tbl.get('class'), '行数:', len(tbl.find_all('tr')))
              else:
                  trs = t.find_all('tr')
                  print(f'  stock_kabuka_dwm: {len(trs)} 行')
                  for i, tr in enumerate(trs[:4]):
                      cells = [td.get_text(strip=True) for td in tr.find_all(['th','td'])]
                      print(f'  row[{i}]:', cells)
                  if len(trs) > 4:
                      last = trs[-1]
                      print(f'  row[-1]:', [td.get_text(strip=True) for td in last.find_all(['th','td'])])
              print()
          "
